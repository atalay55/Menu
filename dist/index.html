<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Fatih Cami Menü</title>
  <meta name="description" content="Fatih Cami Menü - Lezzetli seçenekler, kahvaltı, öğle, akşam yemekleri, tatlılar ve ferahlatıcı içecekler.">
  <link rel="stylesheet" href="./style.css?v=2.0">
</head>
<body>

  <!-- Sticky Top App Header -->
  <header class="app-header">
    <div class="header-inner">
      <div class="brand-wrap">
        <div class="brand-logo-icon">🕌</div>
        <div>
          <h1 class="brand-name">Fatih Cami Menü</h1>
          <span class="brand-sub">Fatih Camii & Külliyesi</span>
        </div>
      </div>
      
      <!-- Language Switcher -->
      <div class="lang-switcher" role="radiogroup" aria-label="Dil Seçimi / Language / Sprache">
        <button class="lang-btn active" data-lang="tr" role="radio" aria-checked="true">TR</button>
        <button class="lang-btn" data-lang="en" role="radio" aria-checked="false">EN</button>
        <button class="lang-btn" data-lang="de" role="radio" aria-checked="false">DE</button>
      </div>
    </div>
  </header>

  <!-- Main Content Wrapper -->
  <main class="main-wrapper">

    <!-- Hero Greeting -->
    <section class="menu-hero">
      <span class="hero-badge" id="heroBadge">✨ Şefin Özel Seçkisi</span>
      <h2 class="hero-title" id="heroTitle">Menümüz</h2>
      <p class="hero-desc" id="heroDesc">
        Taze ve organik malzemelerle hazırlanan eşsiz lezzetlerimizi keşfedin.
      </p>
    </section>

    <!-- Search Box -->
    <div class="search-box-wrap">
      <svg class="search-icon-svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="menuSearch" class="menu-search-input" placeholder="Menüde yemek veya içecek ara..." aria-label="Menüde ara">
    </div>

    <!-- Sticky Horizontal Category Pills -->
    <nav class="category-sticky-bar" aria-label="Kategoriler">
      <div class="category-scroll" id="categoryScroll">
        <button class="cat-tab-btn active" data-category="all">
          <span class="tab-label" data-key="all">Tümü</span>
          <span class="cat-count" id="count-all">15</span>
        </button>
        <button class="cat-tab-btn" data-category="breakfast">
          <span class="tab-label" data-key="breakfast">🍳 Kahvaltı</span>
          <span class="cat-count" id="count-breakfast">3</span>
        </button>
        <button class="cat-tab-btn" data-category="lunch">
          <span class="tab-label" data-key="lunch">🥗 Öğle Yemeği</span>
          <span class="cat-count" id="count-lunch">3</span>
        </button>
        <button class="cat-tab-btn" data-category="dinner">
          <span class="tab-label" data-key="dinner">🥩 Akşam Yemeği</span>
          <span class="cat-count" id="count-dinner">3</span>
        </button>
        <button class="cat-tab-btn" data-category="dessert">
          <span class="tab-label" data-key="dessert">🍰 Tatlılar</span>
          <span class="cat-count" id="count-dessert">3</span>
        </button>
        <button class="cat-tab-btn" data-category="drinks">
          <span class="tab-label" data-key="drinks">🍹 İçecekler</span>
          <span class="cat-count" id="count-drinks">3</span>
        </button>
      </div>
    </nav>

    <!-- Menu Items List -->
    <div class="menu-list" id="menuList" aria-live="polite">
      <!-- Items dynamically populated -->
    </div>

  </main>

  <!-- Bottom Sheet / Modal (Showcase Preview) -->
  <div class="modal-overlay" id="itemModal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="bottom-sheet">
      <div class="sheet-handle"></div>
      <button class="sheet-close-btn" id="modalClose" aria-label="Kapat">&times;</button>
      <img src="" alt="" class="sheet-img" id="modalImg">
      <div class="sheet-body">
        <div class="sheet-title-row">
          <h3 class="sheet-title" id="modalTitle"></h3>
          <span class="sheet-price" id="modalPrice"></span>
        </div>
        <p class="sheet-desc" id="modalDesc"></p>
        <button class="sheet-close-action-btn" id="modalCloseAction">Kapat</button>
      </div>
    </div>
  </div>

  <!-- Menu Data File (Easily edit items, prices, and photos here) -->
  <script src="./menu-data.js?v=2.0"></script>

  <script>
    // Internationalization (i18n)
    const i18n = {
      tr: {
        badge: "✨ Özel Seçki",
        title: "Fatih Cami Menü",
        subtitle: "Özenle hazırlanan taze ve leziz ikramlarımızı keşfedin.",
        searchPlaceholder: "Menüde ara...",
        closeBtn: "Kapat",
        emptyMsg: "Aramanıza uygun lezzet bulunamadı.",
        categories: {
          all: "Tümü",
          breakfast: "🍳 Kahvaltı",
          lunch: "🥗 Öğle Yemeği",
          dinner: "🥩 Akşam Yemeği",
          dessert: "🍰 Tatlılar",
          drinks: "🍹 İçecekler"
        }
      },
      en: {
        badge: "✨ Special Selection",
        title: "Fatih Mosque Menu",
        subtitle: "Discover our freshly prepared authentic and gourmet selections.",
        searchPlaceholder: "Search dishes or drinks...",
        closeBtn: "Close",
        emptyMsg: "No dishes found matching your search.",
        categories: {
          all: "All",
          breakfast: "🍳 Breakfast",
          lunch: "🥗 Lunch",
          dinner: "🥩 Dinner",
          dessert: "🍰 Desserts",
          drinks: "🍹 Drinks"
        }
      },
      de: {
        badge: "✨ Spezielle Auswahl",
        title: "Fatih Moschee Menü",
        subtitle: "Entdecken Sie frisch zubereitete Köstlichkeiten.",
        searchPlaceholder: "Gerichte oder Getränke suchen...",
        closeBtn: "Schließen",
        emptyMsg: "Keine passenden Gerichte gefunden.",
        categories: {
          all: "Alle",
          breakfast: "🍳 Frühstück",
          lunch: "🥗 Mittagessen",
          dinner: "🥩 Abendessen",
          dessert: "🍰 Desserts",
          drinks: "🍹 Getränke"
        }
      }
    };

    // Note: menuItems array is loaded from menu-data.js

    // State
    let currentLang = localStorage.getItem('site_lang') || 'tr';
    let currentCategory = 'all';
    let searchQuery = '';

    // Elements
    const langBtns = document.querySelectorAll('.lang-btn');
    const heroBadge = document.getElementById('heroBadge');
    const heroTitle = document.getElementById('heroTitle');
    const heroDesc = document.getElementById('heroDesc');
    const menuSearch = document.getElementById('menuSearch');
    const menuList = document.getElementById('menuList');
    const categoryTabs = document.querySelectorAll('.cat-tab-btn');

    // Modal Elements
    const itemModal = document.getElementById('itemModal');
    const modalClose = document.getElementById('modalClose');
    const modalCloseAction = document.getElementById('modalCloseAction');
    const modalImg = document.getElementById('modalImg');
    const modalTitle = document.getElementById('modalTitle');
    const modalPrice = document.getElementById('modalPrice');
    const modalDesc = document.getElementById('modalDesc');

    // Update Static UI Text
    function updateUIText() {
      const texts = i18n[currentLang] || i18n.tr;
      document.documentElement.lang = currentLang;
      heroBadge.textContent = texts.badge;
      heroTitle.textContent = texts.title;
      heroDesc.textContent = texts.subtitle;
      menuSearch.placeholder = texts.searchPlaceholder;
      modalCloseAction.textContent = texts.closeBtn;

      document.querySelectorAll('.tab-label').forEach(el => {
        const key = el.getAttribute('data-key');
        if (texts.categories[key]) {
          el.textContent = texts.categories[key];
        }
      });
    }

    // Update Category Counts
    function updateCounts() {
      document.getElementById('count-all').textContent = menuItems.length;
      ['breakfast', 'lunch', 'dinner', 'dessert', 'drinks'].forEach(cat => {
        const el = document.getElementById(`count-${cat}`);
        if (el) el.textContent = menuItems.filter(i => i.category === cat).length;
      });
    }

    // Render Menu Items (Mobile First Cards)
    function renderMenu() {
      const texts = i18n[currentLang] || i18n.tr;
      const filtered = menuItems.filter(item => {
        const matchCategory = currentCategory === 'all' || item.category === currentCategory;
        const name = (item.name[currentLang] || item.name.tr).toLowerCase();
        const desc = (item.desc[currentLang] || item.desc.tr).toLowerCase();
        const q = searchQuery.toLowerCase();
        return matchCategory && (name.includes(q) || desc.includes(q));
      });

      if (filtered.length === 0) {
        menuList.innerHTML = `
          <div class="empty-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="8" y1="12" x2="16" y2="12"></line>
            </svg>
            <p>${texts.emptyMsg}</p>
          </div>
        `;
        return;
      }

      menuList.innerHTML = filtered.map(item => {
        const name = item.name[currentLang] || item.name.tr;
        const desc = item.desc[currentLang] || item.desc.tr;
        const badge = item.badge[currentLang] || item.badge.tr;

        return `
          <article class="food-card" data-id="${item.id}" tabindex="0" role="button" aria-label="${name}">
            <div class="food-info">
              <div class="food-title-row">
                <h3 class="food-title">${name}</h3>
              </div>
              <p class="food-desc">${desc}</p>
              <div class="food-meta-row">
                <span class="food-price">${item.price}</span>
                ${badge ? `<span class="food-badge ${item.badgeClass}">${badge}</span>` : ''}
              </div>
            </div>
            <div class="food-thumb-wrap">
              <img src="${item.img}" alt="${name}" class="food-thumb" loading="lazy">
            </div>
          </article>
        `;
      }).join('');

      // Card Click Handler -> Open Bottom Sheet
      document.querySelectorAll('.food-card').forEach(card => {
        card.addEventListener('click', () => {
          const id = parseInt(card.getAttribute('data-id'));
          openModal(id);
        });
      });
    }

    // Modal Control
    let activeModalItem = null;
    function openModal(id) {
      const item = menuItems.find(i => i.id === id);
      if (!item) return;
      activeModalItem = item;
      modalImg.src = item.img;
      modalImg.alt = item.name[currentLang] || item.name.tr;
      modalTitle.textContent = item.name[currentLang] || item.name.tr;
      modalPrice.textContent = item.price;
      modalDesc.textContent = item.desc[currentLang] || item.desc.tr;
      itemModal.classList.add('active');
      itemModal.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      itemModal.classList.remove('active');
      itemModal.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
    }

    modalClose.addEventListener('click', closeModal);
    modalCloseAction.addEventListener('click', closeModal);
    itemModal.addEventListener('click', (e) => {
      if (e.target === itemModal) closeModal();
    });

    // Language Switcher Event
    langBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        langBtns.forEach(b => {
          b.classList.remove('active');
          b.setAttribute('aria-checked', 'false');
        });
        btn.classList.add('active');
        btn.setAttribute('aria-checked', 'true');
        currentLang = btn.getAttribute('data-lang');
        localStorage.setItem('site_lang', currentLang);

        updateUIText();
        renderMenu();

        if (activeModalItem && itemModal.classList.contains('active')) {
          openModal(activeModalItem.id);
        }
      });
    });

    function setInitialLanguage() {
      langBtns.forEach(btn => {
        if (btn.getAttribute('data-lang') === currentLang) {
          btn.classList.add('active');
          btn.setAttribute('aria-checked', 'true');
        } else {
          btn.classList.remove('active');
          btn.setAttribute('aria-checked', 'false');
        }
      });
    }

    // Category Tabs Switching
    categoryTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        categoryTabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentCategory = tab.getAttribute('data-category');
        renderMenu();
      });
    });

    // Search Input Event
    menuSearch.addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderMenu();
    });

    // Initialize App
    setInitialLanguage();
    updateUIText();
    updateCounts();
    renderMenu();
  </script>
</body>
</html>
