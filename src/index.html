        </div>

        <!-- Horizontal Scrollable Category Tabs -->
        <div class="tabs-scroll-container">
          <ul class="category-tabs" id="categoryTabs" role="tablist">
            <li>
              <button class="tab-btn active" data-category="all" role="tab" aria-selected="true">

                <span class="tab-count" id="count-all">15</span>
              </button>
            </li>
            <li>
              <button class="tab-btn" data-category="breakfast" role="tab" aria-selected="false">

    // Update Static UI Text Based on Language

      const texts = i18n[currentLang] || i18n.tr;
      document.documentElement.lang = currentLang;
      headerBadge.textContent = texts.badge;
      headerTitle.textContent = texts.title;
      headerSubtitle.textContent = texts.subtitle;
      menuSearch.placeholder = texts.searchPlaceholder;
      modalCloseAction.textContent = texts.closeBtn;

      // Update category tab labels
      document.querySelectorAll('.tab-label').forEach(el => {
        const key = el.getAttribute('data-key');
        if (texts.categories[key]) {
          el.textContent = texts.categories[key];
        }
      });
    }

    // Update Tab Counts
    function updateCounts() {
      document.getElementById('count-all').textContent = menuItems.length;
      ['breakfast', 'lunch', 'dinner', 'dessert', 'drinks'].forEach(cat => {
        const el = document.getElementById(`count-${cat}`);
        if (el) el.textContent = menuItems.filter(i => i.category === cat).length;
      });
    }

    // Render Menu Items (Showcase Display)

        const q = searchQuery.toLowerCase();
        const matchSearch = name.includes(q) || desc.includes(q);
        return matchCategory && matchSearch;

            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="8" y1="12" x2="16" y2="12"></line>
            </svg>
            <p>${texts.emptyMsg}</p>
          </div>
        `;
        return;
      }

      menuGrid.innerHTML = filtered.map(item => {
        const name = item.name[currentLang] || item.name.tr;
        const price = item.price;
        const desc = item.desc[currentLang] || item.desc.tr;
        const badge = item.badge[currentLang] || item.badge.tr;

        return `
          <article class="menu-card" data-id="${item.id}" tabindex="0" role="button" aria-label="${name}">
            <div class="card-img-wrap">
              <img src="${item.img}" alt="${name}" class="card-img" loading="lazy">
            </div>
            <div class="card-content">
              <div class="card-header-row">
                <h3 class="item-name">${name}</h3>
                <span class="item-price">${price}</span>
              </div>
              <p class="item-desc">${desc}</p>
              <div class="card-footer-row">
                <div class="item-badges">
                  ${badge ? `<span class="badge ${item.badgeClass}">${badge}</span>` : ''}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');

      // Card Click Handler -> Opens Detail Modal
      document.querySelectorAll('.menu-card').forEach(card => {
        card.addEventListener('click', () => {
          const id = parseInt(card.getAttribute('data-id'));
          openModal(id);
        });
      });
    }

    // Modal Control
    let activeModalItem = null;
    function openModal(id) {
      const item = menuItems.find(i => i.id === id);
      if (!item) return;
      activeModalItem = item;
      modalImg.src = item.img;
      modalImg.alt = item.name[currentLang] || item.name.tr;
      modalTitle.textContent = item.name[currentLang] || item.name.tr;
      modalPrice.textContent = item.price;
      modalDesc.textContent = item.desc[currentLang] || item.desc.tr;
      itemModal.classList.add('active');
      itemModal.setAttribute('aria-hidden', 'false');
    }

    function closeModal() {
      itemModal.classList.remove('active');
      itemModal.setAttribute('aria-hidden', 'true');
    }

    modalClose.addEventListener('click', closeModal);
    modalCloseAction.addEventListener('click', closeModal);
    itemModal.addEventListener('click', (e) => {
      if (e.target === itemModal) closeModal();
    });

    // Language Switching Event
    langBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        langBtns.forEach(b => {
          b.classList.remove('active');
          b.setAttribute('aria-checked', 'false');
        });
        btn.classList.add('active');
        btn.setAttribute('aria-checked', 'true');
        currentLang = btn.getAttribute('data-lang');
        localStorage.setItem('site_lang', currentLang);

        updateUIText();
        renderMenu();

        // If modal is open, refresh modal text too
        if (activeModalItem && itemModal.classList.contains('active')) {
          openModal(activeModalItem.id);
        }
      });
    });

    // Set initial active button for language
    function setInitialLanguage() {
      langBtns.forEach(btn => {
        if (btn.getAttribute('data-lang') === currentLang) {
          btn.classList.add('active');
          btn.setAttribute('aria-checked', 'true');
        } else {
          btn.classList.remove('active');
          btn.setAttribute('aria-checked', 'false');
        }
      });
    }

    // Tab Switching
    categoryTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        categoryTabs.forEach(t => {
          t.classList.remove('active');
          t.setAttribute('aria-selected', 'false');
        });
        tab.classList.add('active');
        tab.setAttribute('aria-selected', 'true');
        currentCategory = tab.getAttribute('data-category');
        renderMenu();
      });
    });

    // Search Input Listener
    menuSearch.addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderMenu();
    });

    // Initialize App
    setInitialLanguage();
    updateUIText();
    updateCounts();
    renderMenu();
  </script>
</body>
</html>
